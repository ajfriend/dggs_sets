# Render the talk with Quarto and publish it to GitHub Pages on every push to main.
# The deck runs no code at render time, so Quarto is all the job needs.
name: Publish the talk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57
      - run: quarto render talk/index.qmd
      - uses: actions/upload-pages-artifact@v3
        with:
          path: talk

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
